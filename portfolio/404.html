<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found</title>
  <script>
    // GitHub Pages has no SPA fallback: send deep links inside a React app back to its entry point.
    (function () {
      var parts = location.pathname.split('/');
      var i = parts.indexOf('taskflow');
      if (i > 0) location.replace(parts.slice(0, i + 1).join('/') + '/');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08070d; color: #f4f3f8; font: 16px/1.6 system-ui, sans-serif; text-align: center; padding: 16px; }
    h1 { font-size: clamp(64px, 18vw, 160px); margin: 0; line-height: 1; background: linear-gradient(110deg, #e879f9, #a855f7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #9b98ab; }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 12px; background: #f4f3f8; color: #0a0910; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <a id="home" href="./">Back to portfolio</a>
  </main>
  <script>
    var seg = location.pathname.split('/')[1];
    if (seg && location.hostname.endsWith('github.io')) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
